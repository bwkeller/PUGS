name: Catalog Build Test
on: [push, pull_request]
jobs:
  build_catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
      - uses: actions/checkout@v4
      - name: Install requirements
        run: |
          pip install .[dev]
      - name: Fetch the test simulation
        run: |
          wget https://nbody.shop/NUGS128.tar.gz
          mkdir -p $HOME/data/
          tar -xvzf NUGS128.tar.gz -C $HOME/data
      - name: Build the halo catalog
        run: |
          cd builder/catalog
          source test_vars
          ./build_catalog.sh test_vars
      - name: Run the tests
        run: |
          cd builder/catalog
          source test_vars
          pytest
