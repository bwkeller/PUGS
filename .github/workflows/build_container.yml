name: Container Build Test
on: [push, pull_request]
jobs:
  build_container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6
      - name: Build the container with the placeholder catalog
        run: |
          cd builder/container
          ./build_container.sh
      - name: Smoke-test the container
        run: |
          cd builder/container
          apptainer exec pugs.sif python -c "import pynbody, pugs, pugs.export, pugs.io"
          if apptainer exec pugs.sif python -c "import tangos" 2>/dev/null; then
            echo "tangos is still installed in the container" >&2
            exit 1
          fi
          apptainer exec pugs.sif test -d /opt/PUGS/data/catalog
          test "$(apptainer exec pugs.sif printenv PUGS_CATALOG)" = "/opt/PUGS/data/catalog"
          test "$(apptainer exec pugs.sif printenv PUGS_SIMULATION)" = "/data/sims"
          test "$(apptainer exec pugs.sif printenv PUGS_HOME)" = "/opt/PUGS"
